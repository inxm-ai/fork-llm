name: Bump app-tgi-core

# fork-llm has no release/tag process, and the existing Tests workflow
# (.github/workflows/test.yml) isn't registered/running on this repo as of
# 2026-09-14 (0 runs, absent from the Actions workflow list) for reasons
# unclear from the repo settings alone - so this workflow does not depend on
# it. It verifies main itself, then opens (or updates) a PR in app-tgi-core
# bumping the `llm` git pin in app/Cargo.lock to the commit that just built
# and tested cleanly, via the same GitHub App used for cross-repo PRs in
# cli-inxm's release.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes to main in quick succession would otherwise verify concurrently
# and both update the single chore/bump-fork-llm-pin branch/PR; a slower run
# for the older commit could finish last and regress the pin. Cancel a
# superseded run instead - only the latest commit on main needs a bump.
concurrency:
  group: bump-app-tgi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup update
      - run: cargo clippy --all --all-targets --all-features
      - run: cargo test
      - run: cargo build --release

  bump-pin:
    name: Open PR bumping the fork-llm pin in app-tgi-core
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Generate app installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: inxm-ai
          repositories: app-tgi-core

      - name: Checkout app-tgi-core
        uses: actions/checkout@v7
        with:
          repository: inxm-ai/app-tgi-core
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: app-tgi-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bump the llm pin to the fork-llm commit that just passed verify
        working-directory: app-tgi-core/app
        env:
          FORK_LLM_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo update -p llm --precise "${FORK_LLM_SHA}"

      - name: Create or update the pin-bump PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: app-tgi-core
          add-paths: app/Cargo.lock
          commit-message: "chore(deps): bump fork-llm pin to ${{ github.sha }}"
          branch: chore/bump-fork-llm-pin
          delete-branch: true
          title: "chore(deps): bump fork-llm pin"
          body: |
            Bumps the `llm` git dependency pin in `app/Cargo.lock` to
            [inxm-ai/fork-llm@${{ github.sha }}](https://github.com/inxm-ai/fork-llm/commit/${{ github.sha }}),
            picking up the fork-llm changes that just merged to `main`.

            Opened automatically after fork-llm's own build+test passed on
            that commit; review the linked fork-llm commit(s) for behavior
            changes before merging.
          base: main
